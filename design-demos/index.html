<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dougong Desktop — 原型方向评审</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9ebee;color:#20252b;font:14px/1.6 'Segoe UI','Microsoft YaHei',sans-serif}button,a{font:inherit}button{cursor:pointer}header{padding:22px 30px 18px;background:#fafbfc;border-bottom:1px solid #d3d8de;display:flex;align-items:center;justify-content:space-between;gap:24px}h1{font-size:22px;letter-spacing:-.6px;margin:0}header p{margin:3px 0 0;color:#57606b}nav{display:flex;gap:6px;background:#e9ecf0;border-radius:10px;padding:4px}nav button{height:44px;padding:0 18px;border:0;background:transparent;border-radius:7px;color:#535c66;white-space:nowrap}nav button[aria-selected=true]{background:#fff;box-shadow:0 1px 4px #18202b18;color:#151a21;font-weight:600}.tools{display:flex;align-items:center;justify-content:space-between;padding:15px 30px;gap:20px}.tools p{margin:0;font-weight:500}.links{display:flex;gap:16px;flex-shrink:0}a{color:#344c66;text-underline-offset:4px}.stage{padding:0 24px}.frame-wrap{overflow:hidden;background:#fff;border:1px solid #bac2ca;border-radius:12px;box-shadow:0 14px 40px #26364812;margin:auto;position:relative}iframe{border:0;width:1440px;height:900px;transform-origin:top left;display:block}footer{padding:17px 30px;display:flex;justify-content:space-between;gap:25px;color:#57606b;font-size:12px}footer a{font-size:12px}.hint{color:#3c5f50}.mobile{display:none}@media(max-width:950px){header{display:block}nav{margin-top:14px;width:max-content}.tools{align-items:flex-start}.tools p{max-width:65%}footer{display:block}}@media(max-width:600px){header{padding:18px}h1{font-size:20px}nav{width:100%}nav button{padding:0 10px;flex:1}.tools{padding:14px 18px;display:block}.tools p{max-width:100%;margin-bottom:8px}.stage{padding:0 10px}.mobile{display:block;padding:0 18px 12px;color:#535d68}footer{padding:16px 18px}}
</style></head>
<body>
<header><div><h1>Dougong Desktop</h1><p>根据三份桌面端方案制作的原型方向初稿</p></div><nav aria-label="选择原型方向"><button data-dir="1" aria-selected="true">A 清晰工作台</button><button data-dir="2" aria-selected="false">B 深色工程台</button><button data-dir="3" aria-selected="false">C 留白伴行</button></nav></header>
<div class="tools"><p id="description">对话优先：以清晰的工具证据和内联审批组织工作。</p><div class="links"><a href="http://127.0.0.1:8766/index.html" target="_blank">打开已选A的深化版</a><a id="standalone" href="dir-1.html" target="_blank">独立打开原型</a><a href="thumbs.html" target="_blank">六个候选总览</a></div></div>
<p class="mobile">当前为桌面画布缩略预览；独立打开可使用精简视图。</p>
<main class="stage"><div class="frame-wrap"><iframe id="prototype" src="dir-1.html" title="Dougong Desktop 可交互原型"></iframe></div></main>
<footer><span class="hint">可体验：四档审批、右栏切换、插件管理、模型设置、Ctrl+K 命令面板。</span><span>离线交互演示，无真实模型或文件操作。终端按方案保留为未实现状态。　<a href="spec.md" target="_blank">功能依据</a></span></footer>
<script>
const descriptions={1:'对话优先：以清晰的工具证据和内联审批组织工作。',2:'检查优先：加宽代码检视区，让对话与文件证据并排呈现。',3:'协作优先：计划进度与榫灵陪伴分区，适合长时间阅读与等待。'};
document.querySelectorAll('[data-dir]').forEach(button=>button.addEventListener('click',()=>{const id=button.dataset.dir;document.querySelectorAll('[data-dir]').forEach(b=>b.setAttribute('aria-selected',String(b===button)));document.getElementById('prototype').src='dir-'+id+'.html';document.getElementById('standalone').href='dir-'+id+'.html';document.getElementById('description').textContent=descriptions[id]}));
function fit(){const wrap=document.querySelector('.frame-wrap');const scale=Math.min(1,document.querySelector('.stage').clientWidth/1440-0.034);wrap.style.width=(1440*scale)+'px';wrap.style.height=(900*scale)+'px';document.getElementById('prototype').style.transform='scale('+scale+')'}fit();addEventListener('resize',fit);
</script></body></html>
