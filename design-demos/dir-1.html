function pluginPage(){return `<section class="page"><div class="page-head"><div><h2>插件</h2><div class="desc">管理这个工作台的能力与外观。</div></div><button class="btn" id="load-local">＋ 装载本地插件</button></div><div class="tabs"><button id="agent-tab" class="${!uiPlugins?'active':''}">Agent 插件</button><button id="ui-tab" class="${uiPlugins?'active':''}">UI 插件</button></div><div id="plugin-list">${uiPlugins?pluginRow('内置工作台','会话、侧栏与右侧工具面板','builtin.ui.shell',true)+pluginRow('榫灵陪伴','随工作状态安静陪伴','builtin.ui.sunling',true):pluginRow('示例插件','SDK 插件装卸演示','Dougong.Sample.Plugin',true)+pluginRow('文件浏览工具','浏览工作区目录与读取文件','builtin.file-tools',true)}</div><div class="note">演示数据。这里管理已安装插件；本地装载、启停与卸载都只模拟界面状态，不会更改实际安装。${uiPlugins?'<br>UI 插件异常只影响对应区域，工作台会保留内置界面。':''}</div></section>`}
function pluginRow(name,desc,id,on){return `<div class="plugin-row"><div><strong>${name}</strong><p>${desc}</p><p>${id} <span style="margin-left:8px">版本：演示</span></p><button class="key" data-uninstall="${id}" style="padding:0;min-height:28px">卸载</button></div><span class="badge-green">已启用</span><button class="switch ${on?'':'off'}" data-switch="${id}" aria-label="启停${name}" aria-pressed="${on}"></button></div>`}
function settingsPage(){return `<section class="page"><h2>设置</h2><p class="desc">为你的工作方式设置一个合适的起点。</p><div class="tabs"><button class="active">模型与提供商</button><button id="appearance-tab">外观与陪伴</button></div><div class="form-grid"><label class="field">提供商名称<input value="自定义提供商" id="provider-name"></label><label class="field">协议<select id="protocol"><option>OpenAI Compatible</option><option>Anthropic</option><option>OpenAI Responses</option></select></label><label class="field wide">Base URL<input placeholder="https://api.example.com/v1" value="https://api.example.com/v1" id="base-url"></label><label class="field wide">模型 ID<input value="example-model" id="model-id"></label><label class="field">最大上下文<input type="number" value="128000" min="1" id="max-context"></label><label class="field">最大输出<input type="number" value="8192" min="1" id="max-output"></label><label class="field wide">凭据来源<select id="credential"><option>系统凭据管理器（演示）</option><option>环境变量 DOUGONG_PROVIDER_KEY</option></select></label></div><div class="note">凭据状态：未连接真实凭据。此原型不收集、不保存密钥。${pending?'<br>当前有待审批回合，提供商只可编辑草稿，回合结束后再切换。':''}</div><div style="display:flex;gap:9px;margin-top:16px"><button class="btn" id="test-connection">模拟测试连接</button><button class="btn primary" id="save-settings">保存原型设置</button></div><section class="settings-section" id="appearance-section"><h3>外观与陪伴</h3><div class="setting-row"><div>显示榫灵<small>陪伴角色可以隐藏，运行状态始终保留。</small></div><button id="pet-toggle" class="switch ${petVisible?'':'off'}" aria-pressed="${petVisible}" aria-label="显示榫灵"></button></div><div class="setting-row"><div>减少动态效果<small>同时遵循系统的减少动态效果设置。</small></div><button id="motion-toggle" class="switch off" aria-pressed="false" aria-label="减少动态效果"></button></div></section></section>`}
function setView(v){view=v;content.innerHTML=v==='plugins'?pluginPage():v==='settings'?settingsPage():chat();$('#page-title').textContent=v==='plugins'?'插件管理':v==='settings'?'设置':'梳理项目结构';$('#reset-demo').style.visibility=v==='conversation'?'visible':'hidden';icons();bindContent();if(v==='conversation'&&decided){restoreDecision()} }
function bindContent(){document.querySelectorAll('[data-approval]').forEach(b=>b.onclick=()=>approve(b.dataset.approval));$('#model-button')?.addEventListener('click',()=>toast(pending?'回合进行中，结束后可在设置中切换提供商。':'在设置中管理自定义提供商。'));$('#send-message')?.addEventListener('click',sendMessage);$('#message')?.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});$('#load-local')?.addEventListener('click',loadLocal);$('#agent-tab')?.addEventListener('click',()=>{uiPlugins=false;setView('plugins')});$('#ui-tab')?.addEventListener('click',()=>{uiPlugins=true;setView('plugins')});document.querySelectorAll('[data-switch]').forEach(b=>b.onclick=()=>{b.classList.toggle('off');let off=b.classList.contains('off');b.setAttribute('aria-pressed',String(!off));b.parentElement.querySelector('.badge-green').textContent=off?'已停用':'已启用';toast('已模拟'+(off?'停用':'启用')+'插件')});document.querySelectorAll('[data-uninstall]').forEach(b=>b.onclick=()=>showModal(`<h3>卸载这个插件？</h3><p>仅模拟卸载 ${b.dataset.uninstall}。不会更改本机插件文件。</p><div class="modal-actions"><button class="btn" id="modal-cancel">取消</button><button class="btn primary" id="modal-confirm">确认模拟卸载</button></div>`,()=>{b.closest('.plugin-row').remove();toast('已从演示列表移除')}));$('#pet-toggle')?.addEventListener('click',()=>{petVisible=!petVisible;$('#pet-place').classList.toggle('hidden',!petVisible);$('#pet-toggle').classList.toggle('off',!petVisible);$('#pet-toggle').setAttribute('aria-pressed',String(petVisible))});$('#motion-toggle')?.addEventListener('click',e=>{e.currentTarget.classList.toggle('off');e.currentTarget.setAttribute('aria-pressed',String(!e.currentTarget.classList.contains('off')))});$('#appearance-tab')?.addEventListener('click',()=>{$('#appearance-section').style.background='#f4f7f9';toast('外观与陪伴设置位于本页下方')});$('#test-connection')?.addEventListener('click',()=>toast('模拟连接成功；未发送网络请求。'));$('#save-settings')?.addEventListener('click',()=>{if(!$('#provider-name').value.trim()||!$('#model-id').value.trim()||Number($('#max-context').value)<=0||Number($('#max-output').value)<=0){toast('请填写提供商、模型与有效的容量');return}toast(pending?'已保存演示草稿；待当前回合结束后切换。':'已保存原型设置；未写入应用配置。')})}
let decision='';function approve(d){if(decided)return;decided=true;decision=d;pending=false;restoreDecision();$('#state-label').textContent=d==='stop'?'已停止':d==='deny'?'等待输入':'已完成';$('#elapsed').textContent=d==='deny'||d==='stop'?'12.4 秒':'13.1 秒';$('#step-last').textContent=d==='deny'||d==='stop'?'− 已拒绝文件读取':'✓ 已模拟读取文件';}
function restoreDecision(){const allowed=decision==='once'||decision==='session';$('#approval-card').innerHTML=`<div class="approval-top" style="padding-bottom:16px"><span class="approval-icon" style="background:${allowed?'#eaf2ee':'#f0f2f5'};color:${allowed?'#32705a':'#737e8c'}">${icon(allowed?'check':'close')}</span><strong>${allowed?(decision==='session'?'本会话已允许此读取':'已允许一次读取'):(decision==='stop'?'已拒绝并停止回合':'已拒绝此读取')}</strong><span class="badge" style="background:#edf2ef;color:#536d5e">已处理</span></div>`;$('#input-lock').classList.add('hidden');$('#message').disabled=false;$('#message').placeholder='继续讨论这个项目…';$('#send-message').disabled=false;if(allowed)$('#followup').innerHTML=`<details class="tools"><summary><span class="check">${icon('check')}</span><span>已读取 SessionComposer.cs</span><span class="tooltime">模拟结果</span>${icon('chevron')}</summary><div class="tool-detail">会话装配由 Framework 层承担，并通过 IPC 向界面提供投影。</div></details><p style="margin-top:18px">已完成这次结构梳理。界面只依赖消息契约，框架层负责会话装配，引擎进程承载运行时。</p>`;else $('#followup').innerHTML='<p style="margin-top:18px">'+(decision==='stop'?'本回合已停止。你可以发起新的任务。':'我不会读取这个文件。你可以调整范围或继续提问。')+'</p>';}
function sendMessage(){let box=$('#message');if(pending||!box?.value.trim())return;const txt=box.value.trim();$('#followup').insertAdjacentHTML('beforeend',`<div class="user" style="margin-top:20px">${esc(txt)}</div><p style="margin-top:15px">这是方向预览，你的消息已在本页展示。完整 Agent 回复将在桌面应用中接入。</p>`);box.value='';$('#conversation').scrollTop=$('#conversation').scrollHeight}
const dockNames={files:['folder','工作区文件'],changes:['diff','本回合改动'],plan:['list','执行计划'],context:['layers','上下文'],terminal:['terminal','终端']};
function setDock(d){dock=d;$('#app').classList.remove('no-inspector');document.querySelectorAll('[data-dock]').forEach(b=>b.classList.toggle('active',b.dataset.dock===d));$('#inspector-title').textContent=dockNames[d][1];$('#inspector-icon').innerHTML=icon(dockNames[d][0]);let html='';if(d==='files')html=`<div class="subtitle"><span>资源管理器</span><span>只读</span></div><div class="file-root">${icon('chevron')}${icon('folder')}Dougong Desktop</div><div class="tree"><div class="folder indent">${icon('chevron')}${icon('folder')}src</div><div class="folder indent" style="padding-left:31px">${icon('chevron')}${icon('folder')}DougongDesktop.Framework</div><div class="file selected"><span class="file-icon">C#</span>SessionComposer.cs</div><div class="file"><span class="file-icon">C#</span>SessionRuntime.cs</div><div class="file"><span class="file-icon">C#</span>IpcApprover.cs</div><div class="file"><span class="file-icon">C#</span>Tools.cs</div><div class="folder indent" style="padding-left:31px">${icon('right')}${icon('folder')}DougongDesktop.Ipc</div><div class="folder indent" style="padding-left:31px">${icon('right')}${icon('folder')}DougongDesktop.AgentHost</div><div class="folder indent">${icon('right')}${icon('folder')}docs</div><div class="file" style="padding-left:23px">Directory.Build.props</div><div class="file" style="padding-left:23px">Directory.Packages.props</div><div class="file" style="padding-left:23px">global.json</div></div><div class="file-caption"><code>SessionComposer.cs</code>会话装配入口，当前待读取。<br>文件列表是原型示例。<button id="preview-file">查看示例预览</button></div>`;if(d==='changes')html=`<div class="empty">${icon('diff')}<strong>本回合没有改动</strong><p>当前任务仅浏览和读取文件。<br>后续改动会集中显示在这里。</p></div>`;if(d==='plan')html=`<div class="subtitle"><span>梳理项目结构</span><span>演示计划</span></div><div class="planstep"><span class="check">✓</span>浏览工作区文件<small>已完成</small></div><div class="planstep"><span class="check">✓</span>确认工程分层<small>已完成</small></div><div class="planstep"><span style="color:#606c79">◌</span> 阅读会话装配代码<small>${pending?'等待审批':'已处理授权'}</small></div><div class="planstep"><span style="color:#606c79">○</span> 整理调用关系<small>待开始</small></div>`;if(d==='context')html=`<div class="subtitle"><span>当前会话</span><span>演示用量</span></div><div class="context-number">24<small>% 已使用</small></div><div class="usage-bar" style="height:8px"><i></i></div><div class="context-legend"><div><span>上下文使用</span><span>30.7k tokens</span></div><div><span>上下文上限</span><span>128k tokens</span></div><div><span>最大输出</span><span>8,192 tokens</span></div><div><span>压缩状态</span><span>尚未压缩</span></div></div><div class="note">压缩为有损操作。真正发生压缩时，会在对话中显示通知。</div>`;if(d==='terminal')html=`<div class="empty">${icon('terminal')}<strong>终端尚未实现</strong><p>本期保留位置。<br>当前原型不会启动 shell 或执行命令。</p></div>`;$('#inspector-content').innerHTML=html;$('#preview-file')?.addEventListener('click',()=>{$('#inspector-content').innerHTML='<div class="subtitle"><span>SessionComposer.cs</span><span>示例预览</span></div><pre class="code-preview"><em>1</em>// 仅供原型展示\n<em>2</em>// Framework 层装配会话\n<em>3</em>// 接入运行时与审批\n<em>4</em>// 通过 IPC 投影给 UI</pre><div class="note">这是说明性预览，不是真实文件读取结果。</div>'})}
function closeModal(){$('#modal-host').innerHTML=''}function showModal(body,fn){$('#modal-host').innerHTML=`<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true">${body}</div></div>`;$('#modal-cancel')?.addEventListener('click',closeModal);$('#modal-confirm')?.addEventListener('click',()=>{closeModal();fn?.()});$('#overlay').onclick=e=>{if(e.target.id==='overlay')closeModal()};$('#modal-host input')?.focus()}
function loadLocal(){showModal(`<h3>装载本地插件</h3><p>输入演示目录。真实应用将让你选择本机插件文件夹。</p><input id="plugin-path" value="C:\\plugins\\sample" aria-label="插件目录"><p>仅装载你信任的插件。Agent 插件可以执行代码，UI 插件可以替换界面区域。</p><p>本页只模拟装载，不会读取该目录。</p><div class="modal-actions"><button class="btn" id="modal-cancel">取消</button><button class="btn primary" id="modal-confirm">信任并模拟装载</button></div>`,()=>{if($('#plugin-list')){$('#plugin-list').insertAdjacentHTML('beforeend',pluginRow('本地示例插件','从演示目录模拟装载','local.sample',true));bindContent()}toast('已模拟装载本地插件')})}
function commands(){showModal(`<input id="command-search" placeholder="输入命令或搜索会话…" aria-label="命令搜索"><div id="commands"><button class="command" data-command="new">新建会话<span class="key">Ctrl N</span></button><button class="command" data-command="conversation">切换到「梳理项目结构」</button><button class="command" data-command="plugins">打开插件管理</button><button class="command" data-command="settings">打开设置</button></div><p style="font-size:12px;margin-bottom:1px">Esc 关闭</p>`);document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>{const c=b.dataset.command;closeModal();c==='new'?newSession():setView(c)});$('#command-search').oninput=e=>document.querySelectorAll('[data-command]').forEach(b=>b.classList.toggle('hidden',!b.textContent.includes(e.target.value)))}
function newSession(){if(pending){toast('请先处理当前审批，再新建会话。');return}setView('conversation');$('#conversation').innerHTML=`<div style="padding-top:65px;text-align:center;color:#606c79"><img src="${logo}" alt="Dougong" style="width:42px;margin-bottom:14px"><h2 style="font-size:23px;color:#323e4b;font-weight:500;margin:0 0 10px">从一件具体的事开始</h2><p>选定工作区，告诉 Dougong 你想完成什么。</p><p style="font-size:12px;color:#606c79">新会话（交互演示）</p></div><div id="followup"></div>`;$('#page-title').textContent='新建会话';$('#message').disabled=false;$('#message').placeholder='描述你的任务…';$('#send-message').disabled=false;$('#input-lock').classList.add('hidden');$('#state-label').textContent='空闲';$('#elapsed').textContent='—';$('#message').focus()}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));document.querySelectorAll('[data-dock]').forEach(b=>b.onclick=()=>setDock(b.dataset.dock));$('#status-capsule').onclick=()=>{let h=$('#steps').classList.toggle('hidden');$('#status-capsule').setAttribute('aria-expanded',String(!h))};$('#collapse-sidebar').onclick=()=>$('#app').classList.toggle('collapsed');$('#close-inspector').onclick=()=>$('#app').classList.add('no-inspector');$('#command-open').onclick=commands;$('#new-session').onclick=newSession;$('#workspace-toggle').onclick=()=>$('#history').classList.toggle('hidden');$('#workspace-info').onclick=()=>toast('工作区是任务范围与权限边界。当前仅展示本地示例。');$('#secondary-workspace').onclick=()=>toast('当前仅演示 Dougong Desktop 工作区；先处理待审批任务。');document.querySelectorAll('[data-session]').forEach(b=>b.onclick=()=>toast('当前有待处理审批，请先完成当前回合。'));$('#reset-demo').onclick=()=>{decided=false;pending=true;decision='';$('#state-label').textContent='等待审批';$('#elapsed').textContent='12.4 秒';$('#step-last').textContent='◌ 等待文件读取授权';setView('conversation')};$('#prototype-info').onclick=()=>toast('清晰工作台方向稿；全部为演示数据，无真实模型与文件操作。');document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();commands()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='n'){e.preventDefault();newSession()}if(e.key==='Escape')closeModal()});if(window.innerWidth<=900)$('#app').classList.add('no-inspector');setView('conversation');setDock('files');if(window.innerWidth<=900)$('#app').classList.add('no-inspector');icons();
</script></body></html>
